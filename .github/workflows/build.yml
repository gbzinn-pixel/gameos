name: Build GamerOS ISO
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Liberar espaço
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h /
      - name: Extrair e corrigir projeto
        run: |
          tar xzf gamer-os-v3.tar.gz
          sed -i 's/curl -fsSL/curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors/g' gamer-os/config/hooks/live/*.hook.chroot
          sed -i -e '1s|.*|#!/bin/bash|' -e 's|^set -e$|set -eo pipefail|' gamer-os/auto/build
      - name: Gerar ISO
        run: |
          docker run --rm --privileged -v "$PWD/gamer-os":/build -w /build debian:trixie bash -c "apt-get update && apt-get install -y live-build && chmod +x auto/* config/hooks/live/* && lb config && lb build"
      - name: Ajustar permissões
        if: always()
        run: sudo chown -R "$USER" gamer-os
      - name: Conferir se a ISO existe
        run: |
          ls -lh gamer-os/*.iso
          sha256sum gamer-os/*.iso | tee gamer-os/SHA256SUMS
      - name: Conferir user-setup na ISO
        run: |
          grep -A8 '^Package: user-setup$' gamer-os/chroot/var/lib/dpkg/status | grep -q 'install ok installed'
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" gamer-os/*.iso gamer-os/SHA256SUMS \
            --title "GamerOS build ${{ github.run_number }}" \
            --notes "ISO gerada automaticamente."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: gamer-os/build.log
